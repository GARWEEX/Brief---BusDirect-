<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>
    <link rel="icon" type="image/jpeg" href="img/image.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>

<body class="min-h-screen relative font-sans bg-gray-50 pb-20">

    <header class="bg-blue-600 text-white w-full flex items-center justify-around py-5">
        <div class="logo">
            <h2 class="text-xl font-bold">logo</h2>
        </div>
        
        <h2 class="text-white px-3 py-1 font-semibold rounded ml-28">Safi->marrakech</h2>
        
        <nav>
            <ul class="flex space-x-4">
                <li>
                    <a href="#" class="text-white text-[18px] px-4 capitalize no-underline">home</a>
                </li>
                <li>
                    <a href="#" class="text-white text-[18px] px-4 capitalize no-underline">Ticket</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="py-6 px-6 flex justify-between items-start">
        <div class="max-w-md w-full p-6 bg-white border border-gray-300 rounded-lg shadow-md">
            
            <p class="text-2xl font-semibold text-black mb-3 text-center">first place</p>
            <div class="grid grid-cols-5 gap-2 mb-6">
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">1</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">2</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">3</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">4</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">5</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">6</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">7</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">8</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">9</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">10</div>
            </div>

            <p class="text-2xl font-semibold text-black mb-3 text-center">seconde place</p>
            <div class="grid grid-cols-5 gap-2">
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">11</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">12</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">13</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">14</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">15</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">16</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">17</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">18</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">19</div>
                <div class="sieg bg-gray-100 text-black font-semibold py-2 rounded text-center">20</div>
            </div>

        </div>

        <div class="max-w-96 w-full p-6 bg-white border border-gray-300 rounded-lg shadow-md" id="myForm">    
            <form id="refrech">
                <p class="text-2xl font-semibold text-black mb-3 text-center">acheter une place</p>
                <div class="flex items-center gap-2 mb-6">
                    <input type="text" id="buyName" placeholder="Entrer votre prénom:" class="border border-gray-300 p-1 rounded w-full">
                    <select id="buySeat" class="border border-gray-300 p-1 rounded">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                    </select>
                    <button type="submit" id="buyBtn" class="bg-blue-600 text-white px-3 py-1 rounded">Submit</button>
                </div>

                <p class="text-2xl font-semibold text-black mb-3 text-center">modifier le nom</p>
                <div class="flex items-center gap-2 mb-6">
                    <input type="number" id="modSeat" placeholder="Entrer ton siege" class="border border-gray-300 p-1 rounded w-full">
                    <input type="text" id="modName" placeholder="Entre le nouveux nom" class="border border-gray-300 p-1 rounded w-full">
                    <button type="button" id="modBtn" class="bg-blue-600 text-white px-3 py-1 rounded">Submit</button>
                </div>

                <p class="text-2xl font-semibold text-black mb-3 text-center">Supprimer</p>
                <div class="flex items-center gap-2">
                    <input type="number" id="delSeat" placeholder="Entrer ton siege" class="border border-gray-300 p-1 rounded w-full">
                    <button type="button" id="delBtn" class="bg-blue-600 text-white px-3 py-1 rounded">Submit</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="absolute bottom-0 w-full bg-blue-600 text-white text-center py-4 text-[22px]">
        <h3>&copy; All Right Reserved</h3>
    </footer>

</body>

</html>
